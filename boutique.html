<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Boutique | MjcymDEV</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #080b12;
            color: white;
        }

        header {
            height: 75px;
            padding: 0 7%;
            background: #0b1019;
            border-bottom: 1px solid #1d2938;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .logo span {
            color: #397cff;
        }

        nav a {
            color: #ccc;
            text-decoration: none;
            margin-left: 25px;
            font-size: 14px;
        }

        nav a:hover {
            color: #397cff;
        }

        .hero {
            text-align: center;
            padding: 90px 20px 60px;
            background: radial-gradient(circle, #172b50, #080b12 65%);
        }

        .hero h1 {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .hero h1 span {
            color: #397cff;
        }

        .hero p {
            color: #8e99aa;
            font-size: 17px;
        }

        .shop {
            padding: 70px 7%;
        }

        .products {
            max-width: 1100px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
