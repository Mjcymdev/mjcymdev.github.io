<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MjcymDEV | Développement FiveM</title>
    <meta name="description" content="MjcymDEV - Développement FiveM, scripts, jobs, interfaces et créations sur mesure.">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #070a10;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* NAVBAR */

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 75px;
            padding: 0 7%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(7, 10, 16, 0.88);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            z-index: 1000;
        }

        .logo {
            font-size: 25px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .logo span {
            color: #397cff;
        }

        nav {
            display: flex;
            gap: 30px;
        }

        nav a {
            color: #b9c1cf;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: 0.3s;
        }

        nav a:hover {
            color: #397cff;
        }

        /* HERO */

        .hero {
            min-height: 100vh;
            padding: 150px 7% 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            overflow: hidden;

            background:
                radial-gradient(circle at 50% 30%, rgba(57,124,255,0.20), transparent 35%),
                radial-gradient(circle at 20% 80%, rgba(255,50,70,0.08), transparent 30%),
                #070a10;
        }

        .hero-content {
            max-width: 900px;
        }

        .badge {
            display: inline-block;
            padding: 9px 16px;
            margin-bottom: 25px;
            border: 1px solid rgba(57,124,255,0.5);
            border-radius: 50px;
            background: rgba(57,124,255,0.08);
            color: #75a4ff;
            font-size: 13px;
            font-weight: bold;
        }

        .hero h1 {
            font-size: clamp(50px, 8vw, 95px);
            line-height: 1;
            margin-bottom: 25px;
            letter-spacing: -4px;
        }

        .hero h1 span {
            color: #397cff;
        }

        .hero p {
            max-width: 720px;
            margin: auto;
            color: #9ba6b7;
            font-size: 18px;
            line-height: 1.7;
        }

        .buttons {
            margin-top: 35px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 15px 25px;
            border-radius: 9px;
            text-decoration: none;
            font-weight: 700;
            transition: 0.3s;
        }

        .btn-primary {
            background: #397cff;
            color: white;
            box-shadow: 0 10px 35px rgba(57,124,255,0.25);
        }

        .btn-secondary {
            border: 1px solid #2a3547;
            background: #10151f;
            color: white;
        }

        .btn:hover {
            transform: translateY(-4px);
        }

        /* SECTIONS */

        section {
            padding: 100px 7%;
        }

        .section-title {
            text-align: center;
            margin-bottom: 55px;
        }

        .section-title .small {
            color: #397cff;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .section-title h2 {
            margin-top: 10px;
            font-size: 42px;
        }

        .section-title p {
            margin: 15px auto 0;
            max-width: 650px;
            color: #7f8a9c;
            line-height: 1.6;
        }

        /* SERVICES */

        .cards {
            max-width: 1200px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .card {
            padding: 30px;
            background: #0d121b;
            border: 1px solid #1b2533;
            border-radius: 15px;
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: #397cff;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }

        .icon {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background: rgba(57,124,255,0.12);
            font-size: 24px;
            margin-bottom: 20px;
        }

        .card h3 {
            margin-bottom: 12px;
            font-size: 19px;
        }

        .card p {
            color: #7f8a9c;
            line-height: 1.6;
            font-size: 14px;
        }

        /* STATS */

        .stats {
            background: #0a0e16;
            border-top: 1px solid #151d29;
            border-bottom: 1px solid #151d29;
        }

        .stats-grid {
            max-width: 1000px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 30px;
            text-align: center;
        }

        .stat h3 {
            font-size: 36px;
            color: #397cff;
        }

        .stat p {
            margin-top: 8px;
            color: #7f8a9c;
            font-size: 14px;
        }

        /* BOUTIQUE */

        .shop {
            background:
                radial-gradient(circle at 50% 0%, rgba(57,124,255,0.08), transparent 40%),
                #070a10;
        }

        .products {
            max-width: 1200px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .product {
            overflow: hidden;
            background: #0d121b;
            border: 1px solid #1b2533;
            border-radius: 16px;
            transition: 0.3s;
        }

        .product:hover {
            transform: translateY(-7px);
            border-color: #397cff;
        }

        .product-image {
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
