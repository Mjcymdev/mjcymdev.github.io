<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MjcymDEV - Développement FiveM</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, sans-serif;
            background: #080b12;
            color: white;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px 7%;
            background: #0b1019;
            border-bottom: 1px solid #1d2938;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .logo span {
            color: #397cff;
        }

        nav a {
            color: #ddd;
            text-decoration: none;
            margin-left: 20px;
        }

        nav a:hover {
            color: #397cff;
        }

        .hero {
            min-height: 100vh;
            padding: 150px 20px 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: radial-gradient(circle, #172b50, #080b12 65%);
        }

        .hero h1 {
            font-size: 70px;
            margin-bottom: 20px;
        }

        .hero h1 span {
            color: #397cff;
        }

        .hero p {
            max-width: 700px;
            margin: auto;
            color: #aeb8c8;
            font-size: 18px;
            line-height: 1.7;
        }

        .buttons {
            margin-top: 30px;
        }

        .button {
            display: inline-block;
            padding: 14px 24px;
            margin: 5px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }

        .blue {
            background: #397cff;
            color: white;
        }

        .dark {
            background: #111925;
            color: white;
            border: 1px solid #30405a;
        }

        section {
            padding: 90px 7%;
        }

        .title {
            text-align: center;
            margin-bottom: 45px;
        }

        .title h2 {
            font-size: 38px;
            margin-bottom: 12px;
        }

        .title p {
            color: #8995a7;
        }

        .cards {
            max-width: 1100px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .card {
            background: #101620;
            border: 1px solid #1d2938;
            border-radius: 12px;
            padding: 25px;
        }

        .card h3 {
            margin-bottom: 12px;
        }

        .card p {
            color: #8995a7;
            line-height: 1.6;
        }

        .shop {
            background: #0b1018;
        }

        .products {
            max-width: 1100px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .product {
            background: #101620;
            border: 1px solid #1d2938;
            border-radius: 12px;
            padding: 30px;
        }

        .product .emoji {
            font-size: 45px;
            margin-bottom: 20px;
        }

        .product p {
            color: #8995a7;
            line-height: 1.6;
            margin-top: 10px;
        }

        .price {
            color: #397cff;
            font-size: 25px;
            font-weight: bold;
            margin: 20px 0;
        }

        .contact {
            text-align: center;
        }

        footer {
            padding: 30px;
            text-align: center;
            color: #697588;
            border-top: 1px solid #1d2938;
        }

        @media (max-width: 800px) {
            header {
                position: relative;
                flex-direction: column;
                gap: 15px;
            }

            nav a {
                margin: 0 6px;
                font-size: 13px;
            }

            .hero h1 {
                font-size: 50px;
            }

            .cards,
            .products {
                grid-template-columns: 1fr;
                max-width: 500px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">
        Mjcym<span>DEV</span>
    </div>

    <nav>
        <a href="#accueil">Accueil</a>
        <a href="#services">Services</a>
        <a href="#boutique.html">Boutique</a>
        <a href="#contact">Contact</a>
    </nav>
</header>

<section class="hero" id="accueil">
    <div>
        <h1>Mjcym<span>DEV</span></h1>

        <p>
            Développement FiveM français spécialisé dans les
            scripts, jobs, interfaces et créations sur mesure
            pour serveurs GTA RP.
        </p>

        <div class="buttons">
            <a href="#boutique" class="button blue">
                Voir la boutique
            </a>

            <a href="#contact" class="button dark">
                Nous contacter
            </a>
        </div>
    </div>
</section>

<section id="services">

    <div class="title">
        <h2>
